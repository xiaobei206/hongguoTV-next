name: Android CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test:
    name: Unit tests, lint, ABI inspection and APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Go 1.26
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: false

      - name: Checkout pinned openhongguo SDK
        uses: actions/checkout@v5
        with:
          repository: xiaobei206/openhongguo
          ref: 1e9334185a46033bcc4e3e30fc41f649958b1389
          path: .build/openhongguo

      - name: Cache Gradle dependencies
        uses: gradle/actions/setup-gradle@v4

      - name: Configure the runner's Android SDK
        shell: bash
        run: |
          set -euo pipefail
          sdk="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$sdk" >> "$GITHUB_ENV"
          echo "$sdk/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$sdk/platform-tools" >> "$GITHUB_PATH"
          test -x "$sdk/cmdline-tools/latest/bin/sdkmanager" || {
            echo "sdkmanager is missing from the runner's preinstalled Android SDK: $sdk" >&2
            exit 1
          }

      - name: Install compile SDK
        shell: bash
        run: |
          set -eu
          set +o pipefail
          yes | sdkmanager --licenses >/dev/null
          set -o pipefail
          sdk="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          sdkmanager --channel=3 --install "platforms;android-37.0" "build-tools;37.0.0" "platform-tools" "ndk;27.2.12479018"
          echo "ANDROID_NDK_HOME=$sdk/ndk/27.2.12479018" >> "$GITHUB_ENV"
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Patch, test and build the pinned openhongguo AAR
        shell: bash
        run: |
          set -euo pipefail
          expected="1e9334185a46033bcc4e3e30fc41f649958b1389"
          actual="$(git -C .build/openhongguo rev-parse HEAD)"
          test "$actual" = "$expected"
          echo "Pinned openhongguo source revision: $actual"
          python3 scripts/patch-openhongguo.py .build/openhongguo
          (
            cd .build/openhongguo
            go test ./...
            (cd bindings/mobile/core && go test ./...)
          )
          go install golang.org/x/mobile/cmd/gomobile@v0.0.0-20261011034528-197770444867
          gomobile init
          (
            cd .build/openhongguo/bindings/mobile
            chmod +x build.sh
            ./build.sh android
          )
          aar="$GITHUB_WORKSPACE/.build/openhongguo/bindings/mobile/android/build/outputs/aar/openhongguo-release.aar"
          test -s "$aar"
          unzip -t "$aar" >/dev/null
          echo "OPENHONGGUO_AAR=$aar" >> "$GITHUB_ENV"
          echo "Built SDK AAR: $aar"

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Run unit tests
        run: ./gradlew --no-daemon --stacktrace testDebugUnitTest -PpatchedOpenhongguoAar="$OPENHONGGUO_AAR"

      - name: Run Android Lint and print report
        shell: bash
        run: |
          set +e
          ./gradlew --no-daemon --stacktrace lintDebug -PpatchedOpenhongguoAar="$OPENHONGGUO_AAR"
          result=$?
          set -e
          report="$(find app/build -type f -name 'lint-results-debug.txt' -print -quit)"
          if [[ -n "$report" ]]; then
            echo "Full Android Lint report: $report"
            cat "$report"
          else
            echo "Android Lint report was not generated." >&2
          fi
          exit "$result"

      - name: Build test-signed APKs
        run: ./gradlew --no-daemon --stacktrace assembleDebug -PpatchedOpenhongguoAar="$OPENHONGGUO_AAR"

      - name: Inspect AAR native libraries and ABI APK outputs
        shell: bash
        run: |
          set -euo pipefail
          echo "Pinned custom SDK AAR: $OPENHONGGUO_AAR"
          unzip -t "$OPENHONGGUO_AAR" >/dev/null
          native_sdk_entries="$(unzip -Z1 "$OPENHONGGUO_AAR" | grep -E '^jni/[^/]+/.*\.so$' || true)"
          if [[ -z "$native_sdk_entries" ]]; then
            echo "::error::The pinned openhongguo AAR has no JNI libraries."
            exit 1
          fi
          printf 'Pinned SDK native libraries:\n%s\n' "$native_sdk_entries"
          echo "Other resolved AARs containing native libraries (includes transitive runtime dependencies):"
          found_native=false
          while IFS= read -r -d '' aar; do
            native_entries="$(unzip -Z1 "$aar" | grep -E '^jni/[^/]+/.*\.so$' || true)"
            if [[ -n "$native_entries" ]]; then
              found_native=true
              echo "== $aar =="
              printf '%s\n' "$native_entries"
            fi
          done < <(find "$HOME/.gradle/caches/modules-2/files-2.1" -type f -name '*.aar' -print0)
          if [[ "$found_native" == false ]]; then
            echo "No JNI .so files were found in the resolved AAR cache."
          fi

          echo "Debug APK outputs:"
          find app/build/outputs/apk/debug -type f -name '*.apk' -print
          apk="$(find app/build/outputs/apk/debug -type f -iname '*universal*.apk' -print -quit)"
          if [[ -z "$apk" ]]; then
            echo "::error::No universal debug APK output was generated"
            exit 1
          fi
          actual_min_sdk="$("$ANDROID_HOME/build-tools/37.0.0/aapt" dump badging "$apk" | sed -n "s/^sdkVersion:'\\([0-9][0-9]*\\)'$/\\1/p")"
          if [[ "$actual_min_sdk" != "23" ]]; then
            echo "::error::Expected minSdk API 23 in the built APK, found '${actual_min_sdk:-missing}'."
            exit 1
          fi
          echo "Verified APK minimum SDK: API $actual_min_sdk (Android 6.0)."
          echo "Inspecting actual packaged libraries in: $apk"
          entries="$(unzip -Z1 "$apk")"
          for abi in x86_64 arm64-v8a armeabi-v7a; do
            abi_entries="$(printf '%s\n' "$entries" | grep -E "^lib/$abi/.*\.so$" || true)"
            if [[ -z "$abi_entries" ]]; then
              echo "::error::Universal APK does not contain native libraries for $abi"
              exit 1
            fi
            printf 'ABI %s libraries:\n%s\n' "$abi" "$abi_entries"
            if ! printf '%s\n' "$abi_entries" | grep -q '/libgojni\.so$'; then
              echo "::error::openhongguo libgojni.so is missing for $abi"
              exit 1
            fi
          done
          echo "All three target ABIs and openhongguo libgojni.so are present in the universal APK."

      - name: Prepare APK, certificate details and SHA-256
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          apk="$(find app/build/outputs/apk/debug -type f -iname '*universal*.apk' -print -quit)"
          if [[ -z "$apk" ]]; then
            echo "Could not locate the universal debug APK." >&2
            exit 1
          fi
          output="hongguoTV-next-v0.1.26-universal-test-signed.apk"
          cp "$apk" "dist/$output"
          "$ANDROID_HOME/build-tools/37.0.0/apksigner" verify --print-certs "dist/$output" > "dist/hongguoTV-next-v0.1.26-test-certificate.txt"
          (cd dist && sha256sum "$output" > hongguoTV-next-v0.1.26-SHA256SUMS.txt)
          cat "dist/hongguoTV-next-v0.1.26-SHA256SUMS.txt"
          cat "dist/hongguoTV-next-v0.1.26-test-certificate.txt"

      - name: Upload test APK and checksums
        uses: actions/upload-artifact@v4
        with:
          name: hongguoTV-next-v0.1.26-test-apk
          path: |
            dist/hongguoTV-next-v0.1.26-universal-test-signed.apk
            dist/hongguoTV-next-v0.1.26-SHA256SUMS.txt
            dist/hongguoTV-next-v0.1.26-test-certificate.txt
          if-no-files-found: error
          retention-days: 30

      - name: Prepare optional release signing inputs in repository root
        id: release-signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          root_keystore="$GITHUB_WORKSPACE/hongguoTV-next-release.jks"
          root_secrets="$GITHUB_WORKSPACE/signing-secrets.txt"
          if [[ -f "$root_keystore" && -f "$root_secrets" ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Using the root-level signing key and signing-secrets.txt from this personal-use project."
            exit 0
          fi
          if [[ -f "$root_keystore" || -f "$root_secrets" ]]; then
            echo "::error::Only one root-level signing file exists. Both hongguoTV-next-release.jks and signing-secrets.txt are required."
            exit 1
          fi

          count=0
          for value in "$ANDROID_KEYSTORE_BASE64" "$ANDROID_KEYSTORE_PASSWORD" "$ANDROID_KEY_ALIAS" "$ANDROID_KEY_PASSWORD"; do
            if [[ -n "$value" ]]; then count=$((count + 1)); fi
          done

          if [[ "$count" -eq 0 ]]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Release signing secrets are not configured; only the clearly marked test-signed APK will be produced."
            exit 0
          fi
          if [[ "$count" -ne 4 ]]; then
            echo "::error::Release signing is partially configured. Set all four required GitHub Actions Secrets or leave all four empty."
            exit 1
          fi

          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$GITHUB_WORKSPACE/hongguoTV-next-release.jks"
          python3 - <<'PY'
          import os
          from pathlib import Path

          def escape_property(value: str) -> str:
              return (value.replace("\\", "\\\\")
                      .replace("\n", "\\n")
                      .replace("\r", "\\r")
                      .replace("\t", "\\t")
                      .replace(" ", "\\ ")
                      .replace("=", "\\=")
                      .replace(":", "\\:")
                      .replace("#", "\\#")
                      .replace("!", "\\!"))

          values = {
              "ANDROID_KEYSTORE_PASSWORD": os.environ["ANDROID_KEYSTORE_PASSWORD"],
              "ANDROID_KEY_ALIAS": os.environ["ANDROID_KEY_ALIAS"],
              "ANDROID_KEY_PASSWORD": os.environ["ANDROID_KEY_PASSWORD"],
          }
          path = Path(os.environ["GITHUB_WORKSPACE"]) / "signing-secrets.txt"
          path.write_text("".join(f"{k}={escape_property(v)}\n" for k, v in values.items()), encoding="utf-8")
          path.chmod(0o600)
          PY
          chmod 600 "$GITHUB_WORKSPACE/hongguoTV-next-release.jks"
          echo "enabled=true" >> "$GITHUB_OUTPUT"

      - name: Build formally signed release APKs
        if: steps.release-signing.outputs.enabled == 'true'
        run: ./gradlew --no-daemon --stacktrace assembleRelease -PpatchedOpenhongguoAar="$OPENHONGGUO_AAR"

      - name: Verify formal release certificate and SHA-256
        if: steps.release-signing.outputs.enabled == 'true'
        shell: bash
        run: |
          set -euo pipefail
          apk="$(find app/build/outputs/apk/release -type f -iname '*universal*.apk' -print -quit)"
          if [[ -z "$apk" ]]; then
            echo "Could not locate the universal release APK." >&2
            exit 1
          fi
          output="hongguoTV-next-v0.1.26-universal-release-signed.apk"
          cp "$apk" "dist/$output"
          "$ANDROID_HOME/build-tools/37.0.0/apksigner" verify --print-certs "dist/$output" > "dist/hongguoTV-next-v0.1.26-release-certificate.txt"
          (cd dist && sha256sum "$output" > hongguoTV-next-v0.1.26-RELEASE-SHA256SUMS.txt)
          cat "dist/hongguoTV-next-v0.1.26-RELEASE-SHA256SUMS.txt"
          cat "dist/hongguoTV-next-v0.1.26-release-certificate.txt"

      - name: Upload formally signed release APK
        if: steps.release-signing.outputs.enabled == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: hongguoTV-next-v0.1.26-formal-release
          path: |
            dist/hongguoTV-next-v0.1.26-universal-release-signed.apk
            dist/hongguoTV-next-v0.1.26-RELEASE-SHA256SUMS.txt
            dist/hongguoTV-next-v0.1.26-release-certificate.txt
          if-no-files-found: error
          retention-days: 30

      - name: Remove temporary signing materials
        if: always()
        shell: bash
        run: |
          rm -f "$GITHUB_WORKSPACE/hongguoTV-next-release.jks"
          rm -f "$GITHUB_WORKSPACE/signing-secrets.txt"
